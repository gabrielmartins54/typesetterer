name: Release

# Push a tag like v2.4.0 (or create a GitHub release with that tag) to publish an update.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Get version from tag
        id: ver
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          # Velopack needs semver (x.y.z): pad "3.15" -> "3.15.0"
          while [ "$(echo "$v" | tr -cd . | wc -c)" -lt 2 ]; do v="$v.0"; done
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Publish
        run: dotnet publish Typesetterer3.csproj -c Release -r win-x64 --self-contained -o publish /p:Version=${{ steps.ver.outputs.version }}

      - name: Install vpk
        run: dotnet tool install -g vpk

      - name: Download previous release (for delta packages)
        run: vpk download github --repoUrl https://github.com/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Pack
        run: vpk pack --packId Typesetterer3 --packVersion ${{ steps.ver.outputs.version }} --packDir publish --mainExe Typesetterer3.exe --icon Assets/AppIcon.ico

      - name: Upload to GitHub release
        run: vpk upload github --repoUrl https://github.com/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }} --publish --releaseName "v${{ steps.ver.outputs.version }}" --tag v${{ steps.ver.outputs.version }}
